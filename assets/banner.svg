<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0B1120" />
    </linearGradient>

    <!-- Animated Glow Orbs -->
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0" />
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E0E7FF" />
      <stop offset="70%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Pill Gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.6" />
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <style>
      .text-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.8px;
      }
      .text-sub {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        letter-spacing: 0.1px;
      }
      .text-badge {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 12px;
        letter-spacing: 0.8px;
        text-transform: uppercase;
      }
      .floating-card {
        transition: transform 0.5s ease;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGrad)" />
  <rect width="1196" height="416" x="2" y="2" rx="18" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Animated Glowing Background Orbs -->
  <circle cx="180" cy="100" r="220" fill="url(#glowCyan)">
    <animate attributeName="cy" values="100;140;100" dur="9s" repeatCount="indefinite" />
    <animate attributeName="cx" values="180;220;180" dur="11s" repeatCount="indefinite" />
  </circle>

  <circle cx="1020" cy="300" r="240" fill="url(#glowViolet)">
    <animate attributeName="cy" values="300;260;300" dur="8s" repeatCount="indefinite" />
    <animate attributeName="cx" values="1020;980;1020" dur="12s" repeatCount="indefinite" />
  </circle>

  <circle cx="620" cy="380" r="180" fill="url(#glowPink)">
    <animate attributeName="r" values="180;220;180" dur="10s" repeatCount="indefinite" />
  </circle>

  <!-- Tech Grid Background Lines -->
  <g stroke="#334155" stroke-width="0.75" stroke-opacity="0.3">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />

    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Animated Data Flows / Flow Lines -->
  <path d="M 80 180 Q 250 80 450 180 T 800 180 T 1120 120" fill="none" stroke="#38BDF8" stroke-width="1.8" stroke-opacity="0.4" stroke-dasharray="10 8">
    <animate attributeName="stroke-dashoffset" from="0" to="-100" dur="4s" repeatCount="indefinite" />
  </path>
  <path d="M 120 320 Q 350 380 600 290 T 1080 300" fill="none" stroke="#818CF8" stroke-width="1.6" stroke-opacity="0.35" stroke-dasharray="8 6">
    <animate attributeName="stroke-dashoffset" from="0" to="100" dur="6s" repeatCount="indefinite" />
  </path>

  <!-- Peripheral Floating Cards (Stationed safely away from center title) -->
  <!-- Top Left: React Native / NativeScript -->
  <g class="floating-card" filter="url(#cardShadow)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-8; 0,0" dur="5.5s" repeatCount="indefinite" />
    <rect x="50" y="35" width="170" height="46" rx="10" fill="#1E293B" fill-opacity="0.75" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="70" cy="58" r="5" fill="#38BDF8" />
    <text x="85" y="62" fill="#E2E8F0" class="text-sub" font-size="13" font-weight="600">⚛️ React Native</text>
  </g>

  <!-- Top Right: Flutter / Dart -->
  <g class="floating-card" filter="url(#cardShadow)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-10; 0,0" dur="6.5s" repeatCount="indefinite" />
    <rect x="980" y="35" width="170" height="46" rx="10" fill="#1E293B" fill-opacity="0.75" stroke="#818CF8" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="1000" cy="58" r="5" fill="#818CF8" />
    <text x="1015" y="62" fill="#E2E8F0" class="text-sub" font-size="13" font-weight="600">💙 Flutter Engine</text>
  </g>

  <!-- Bottom Left: Ionic & Capacitor -->
  <g class="floating-card" filter="url(#cardShadow)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,7; 0,0" dur="6s" repeatCount="indefinite" />
    <rect x="50" y="335" width="180" height="46" rx="10" fill="#1E293B" fill-opacity="0.75" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="70" cy="358" r="5" fill="#38BDF8" />
    <text x="85" y="362" fill="#E2E8F0" class="text-sub" font-size="13" font-weight="600">⚡ Ionic &amp; Capacitor</text>
  </g>

  <!-- Bottom Right: Low-Code & Enterprise -->
  <g class="floating-card" filter="url(#cardShadow)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,8; 0,0" dur="5s" repeatCount="indefinite" />
    <rect x="960" y="335" width="190" height="46" rx="10" fill="#1E293B" fill-opacity="0.75" stroke="#EC4899" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="980" cy="358" r="5" fill="#EC4899" />
    <text x="995" y="362" fill="#E2E8F0" class="text-sub" font-size="13" font-weight="600">🚀 Low-Code &amp; MADP</text>
  </g>

  <!-- CENTER FOREGROUND CONTENT (Protected high z-index & high contrast) -->
  <g id="foreground-content">
    <!-- Top Pill Badge -->
    <g transform="translate(425, 65)">
      <rect x="0" y="0" width="350" height="34" rx="17" fill="url(#pillGrad)" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.6" />
      <circle cx="20" cy="17" r="4" fill="#38BDF8">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="35" y="22" fill="#BAE6FD" class="text-badge">📱 TOP MOBILE FRAMEWORKS ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="165" text-anchor="middle" class="text-title" font-size="44" fill="url(#titleGrad)">
      Awesome Mobile Development Frameworks
    </text>

    <!-- Subtitle -->
    <text x="600" y="215" text-anchor="middle" class="text-sub" font-size="18" fill="#CBD5E1">
      Curated List of SaaS Platforms &amp; Open-Source Projects for Cross-Platform, Web-Tech Reuse &amp; Native Apps
    </text>

    <!-- Secondary Meta Description Line -->
    <text x="600" y="246" text-anchor="middle" class="text-sub" font-size="14.5" fill="#94A3B8">
      Architectural Comparisons • Specific Pricing • Free Tier Limits • GitHub Stargazer Rankings
    </text>

    <!-- Feature Pills in Bottom Foreground -->
    <g transform="translate(195, 282)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="180" height="38" rx="19" fill="#1E293B" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
        <text x="90" y="24" text-anchor="middle" fill="#F1F5F9" class="text-sub" font-size="13" font-weight="600">🌐 Web-Tech Reuse</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(195, 0)">
        <rect width="195" height="38" rx="19" fill="#1E293B" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
        <text x="97" y="24" text-anchor="middle" fill="#F1F5F9" class="text-sub" font-size="13" font-weight="600">📱 Cross-Platform iOS/Android</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(405, 0)">
        <rect width="185" height="38" rx="19" fill="#1E293B" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
        <text x="92" y="24" text-anchor="middle" fill="#F1F5F9" class="text-sub" font-size="13" font-weight="600">⚡ Native Compilation</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(605, 0)">
        <rect width="200" height="38" rx="19" fill="#1E293B" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
        <text x="100" y="24" text-anchor="middle" fill="#F1F5F9" class="text-sub" font-size="13" font-weight="600">📊 Enterprise Low-Code</text>
      </g>
    </g>
  </g>
</svg>
